<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 학업 플래너</title>
    <!-- Firebase SDK (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-cream: #FFFDD0;
            --btn-green: #4CAF50;
            --btn-green-hover: #45a049;
            --card-bg: #FFFFFF;
            --text-dark: #333333;
        }
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        button {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: var(--btn-green-hover); }
        input, select { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        
        /* 인증 화면 */
        #auth-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        
        /* 메인 앱 화면 */
        #app-container {
            display: none;
            width: 100%;
            max-width: 1000px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; }
        
        /* 타이머 (상단 크게) */
        .timer-section {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .time-display { font-size: 4rem; font-weight: bold; margin: 20px 0; color: var(--btn-green); }
        
        /* 하단 그리드 (D-Day, 투두, 우리학교랭킹, 전국랭킹) */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
        
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 { margin-top: 0; color: var(--btn-green); border-bottom: 2px solid var(--btn-green); padding-bottom: 5px; }
        
        /* 투두리스트 */
        .todo-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .todo-item.completed span { text-decoration: line-through; color: #888; }
        
        /* 랭킹 리스트 */
        .rank-list { list-style: none; padding: 0; margin: 0; }
        .rank-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <!-- 로그인 및 회원가입 화면 -->
    <div id="auth-container">
        <h2>나의 학업 플래너</h2>
        <div id="login-form" class="auth-form">
            <input type="email" id="login-email" placeholder="이메일">
            <input type="password" id="login-pw" placeholder="비밀번호">
            <button onclick="login()">로그인</button>
            <p>계정이 없으신가요? <a href="#" onclick="toggleAuth()">회원가입</a></p>
        </div>
        <div id="signup-form" class="auth-form" style="display: none;">
            <input type="email" id="signup-email" placeholder="이메일">
            <input type="password" id="signup-pw" placeholder="비밀번호 (6자리 이상)">
            <input type="text" id="signup-school" placeholder="학교명 (예: 한국고등학교)">
            <input type="number" id="signup-grade" placeholder="학년 (1~3)">
            <input type="text" id="signup-nickname" placeholder="닉네임">
            <button onclick="signup()">계정 생성</button>
            <p>이미 계정이 있으신가요? <a href="#" onclick="toggleAuth()">로그인</a></p>
        </div>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="app-container">
        <div class="header">
            <h2 id="welcome-msg">환영합니다!</h2>
            <button onclick="logout()" style="background-color: #f44336;">로그아웃</button>
        </div>

        <!-- 타이머 -->
        <div class="timer-section">
            <h2>과목별 공부 타이머</h2>
            <input type="text" id="subject-input" placeholder="공부할 과목 입력 (예: 수학)">
            <div class="time-display" id="time-display">00:00:00</div>
            <button onclick="startTimer()">시작</button>
            <button onclick="pauseTimer()" style="background-color: #ff9800;">정지</button>
            <button onclick="stopTimer()" style="background-color: #f44336;">종료 및 저장</button>
            <p>오늘 총 공부 시간: <span id="total-time-display">0분</span></p>
        </div>

        <div class="grid-container">
            <!-- D-Day 카운터 -->
            <div class="card">
                <h3>D-Day 카운터</h3>
                <input type="text" id="dday-name" placeholder="시험 이름">
                <input type="date" id="dday-date">
                <button onclick="addDday()">설정</button>
                <div id="dday-result" style="margin-top: 15px; font-size: 1.5rem; font-weight: bold; color: var(--btn-green);"></div>
            </div>

            <!-- 투두리스트 -->
            <div class="card">
                <h3>오늘의 할 일</h3>
                <input type="text" id="todo-subject" placeholder="과목/내용">
                <input type="text" id="todo-amount" placeholder="분량 (예: 10~20페이지)">
                <button onclick="addTodo()">추가</button>
                <div id="todo-list" style="margin-top: 15px;"></div>
            </div>

            <!-- 우리 학교 랭킹 -->
            <div class="card">
                <h3 id="school-rank-title">우리 학교 랭킹</h3>
                <ul class="rank-list" id="school-rank-list">
                    <li>데이터를 불러오는 중...</li>
                </ul>
            </div>

            <!-- 전국 학교 랭킹 -->
            <div class="card">
                <h3>전국 학교 랭킹</h3>
                <ul class="rank-list" id="national-rank-list">
                    <li>데이터를 불러오는 중...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // ★★★ 여기에 본인의 Firebase 설정값을 넣어야 합니다 ★★★
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Firebase 초기화
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userData = null;

        // 화면 전환 로직
        function toggleAuth() {
            const login = document.getElementById('login-form');
            const signup = document.getElementById('signup-form');
            if(login.style.display === 'none') {
                login.style.display = 'flex';
                signup.style.display = 'none';
            } else {
                login.style.display = 'none';
                signup.style.display = 'flex';
            }
        }

        // 인증 상태 관찰
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                await loadUserData();
                loadRankings();
            } else {
                currentUser = null;
                userData = null;
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        // 회원가입
        async function signup() {
            const email = document.getElementById('signup-email').value;
            const pw = document.getElementById('signup-pw').value;
            const school = document.getElementById('signup-school').value;
            const grade = document.getElementById('signup-grade').value;
            const nickname = document.getElementById('signup-nickname').value;

            if(!email || !pw || !school || !grade || !nickname) return alert("모든 정보를 입력해주세요.");

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, pw);
                await db.collection("users").doc(userCredential.user.uid).set({
                    email, school, grade, nickname, totalStudyTime: 0, todos: [], dday: null
                });
                alert("회원가입 완료!");
            } catch (error) {
                alert("회원가입 에러: " + error.message);
            }
        }

        // 로그인
        async function login() {
            const email = document.getElementById('login-email').value;
            const pw = document.getElementById('login-pw').value;
            try {
                await auth.signInWithEmailAndPassword(email, pw);
            } catch (error) {
                alert("로그인 실패: 이메일과 비밀번호를 확인해주세요.");
            }
        }

        // 로그아웃
        function logout() { auth.signOut(); }

        // 유저 데이터 로드
        async function loadUserData() {
            const doc = await db.collection("users").doc(currentUser.uid).get();
            if (doc.exists) {
                userData = doc.data();
                document.getElementById('welcome-msg').innerText = `${userData.school} ${userData.grade}학년 ${userData.nickname}님, 파이팅!`;
                document.getElementById('school-rank-title').innerText = `${userData.school} 랭킹`;
                document.getElementById('total-time-display').innerText = Math.floor(userData.totalStudyTime / 60) + "분";
                
                // D-Day 불러오기
                if(userData.dday) {
                    document.getElementById('dday-name').value = userData.dday.name;
                    document.getElementById('dday-date').value = userData.dday.date;
                    calculateDday(userData.dday.name, userData.dday.date);
                }
                // Todo 불러오기
                renderTodos();
            }
        }

        // 데이터 저장 헬퍼
        async function saveUserData() {
            if(currentUser && userData) {
                await db.collection("users").doc(currentUser.uid).update(userData);
            }
        }

        /* --- 타이머 로직 --- */
        let timerInterval;
        let seconds = 0;
        let isRunning = false;

        function updateTimeDisplay() {
            const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            document.getElementById('time-display').innerText = `${h}:${m}:${s}`;
        }

        function startTimer() {
            if (!document.getElementById('subject-input').value) return alert("과목을 입력해주세요.");
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                seconds++;
                updateTimeDisplay();
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        async function stopTimer() {
            pauseTimer();
            if(seconds > 0) {
                userData.totalStudyTime += seconds; // 초 단위 누적
                await saveUserData();
                document.getElementById('total-time-display').innerText = Math.floor(userData.totalStudyTime / 60) + "분";
                alert(`공부 시간 저장 완료! (${Math.floor(seconds/60)}분)`);
                seconds = 0;
                updateTimeDisplay();
                loadRankings(); // 랭킹 업데이트
            }
        }

        /* --- D-Day 로직 --- */
        function addDday() {
            const name = document.getElementById('dday-name').value;
            const date = document.getElementById('dday-date').value;
            if(!name || !date) return alert("입력이 비어있습니다.");
            
            userData.dday = { name, date };
            saveUserData();
            calculateDday(name, date);
        }

        function calculateDday(name, dateStr) {
            const targetDate = new Date(dateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const resDiv = document.getElementById('dday-result');
            if(diffDays > 0) resDiv.innerText = `${name} D-${diffDays}`;
            else if(diffDays === 0) resDiv.innerText = `${name} D-Day!!`;
            else resDiv.innerText = `${name} 시험이 ${Math.abs(diffDays)}일 지났습니다.`;
        }

        /* --- 투두리스트 로직 --- */
        if(!userData) userData = { todos: [] };

        function renderTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            userData.todos.forEach((todo, index) => {
                const div = document.createElement('div');
                div.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <span onclick="toggleTodo(${index})" style="cursor:pointer; flex:1;">
                        ${todo.completed ? '✅' : '⬜'} ${todo.subject} - ${todo.amount}
                    </span>
                    <button onclick="editTodo(${index})" style="background:#2196F3; padding:5px; font-size:12px;">수정</button>
                    <button onclick="deleteTodo(${index})" style="background:#f44336; padding:5px; font-size:12px; margin-left:5px;">삭제</button>
                `;
                list.appendChild(div);
            });
        }

        function addTodo() {
            const subject = document.getElementById('todo-subject').value;
            const amount = document.getElementById('todo-amount').value;
            if(!subject || !amount) return alert("과목과 분량을 입력하세요.");
            userData.todos.push({ subject, amount, completed: false });
            saveUserData();
            renderTodos();
            document.getElementById('todo-subject').value = '';
            document.getElementById('todo-amount').value = '';
        }

        function toggleTodo(index) {
            userData.todos[index].completed = !userData.todos[index].completed;
            saveUserData();
            renderTodos();
        }

        function deleteTodo(index) {
            userData.todos.splice(index, 1);
            saveUserData();
            renderTodos();
        }

        function editTodo(index) {
            const newAmount = prompt("새로운 분량을 입력하세요:", userData.todos[index].amount);
            if(newAmount !== null && newAmount.trim() !== "") {
                userData.todos[index].amount = newAmount;
                saveUserData();
                renderTodos();
            }
        }

        /* --- 랭킹 로직 --- */
        async function loadRankings() {
            if(!userData) return;
            
            // 1. 우리 학교 랭킹
            const schoolQuery = await db.collection("users")
                .where("school", "==", userData.school)
                .orderBy("totalStudyTime", "desc").limit(10).get();
            
            const sList = document.getElementById('school-rank-list');
            sList.innerHTML = '';
            schoolQuery.forEach((doc, index) => {
                const data = doc.data();
                const mins = Math.floor(data.totalStudyTime / 60);
                sList.innerHTML += `<li><span>${index+1}위. ${data.nickname} (${data.grade}학년)</span> <span>${mins}분</span></li>`;
            });

            // 2. 전국 학교 랭킹 (학교별 시간 합산)
            const allUsers = await db.collection("users").get();
            const schoolTotals = {};
            allUsers.forEach(doc => {
                const data = doc.data();
                if(data.school) {
                    if(!schoolTotals[data.school]) schoolTotals[data.school] = 0;
                    schoolTotals[data.school] += data.totalStudyTime;
                }
            });

            const sortedSchools = Object.entries(schoolTotals).sort((a, b) => b[1] - a[1]).slice(0, 10);
            
            const nList = document.getElementById('national-rank-list');
            nList.innerHTML = '';
            if(sortedSchools.length === 0) nList.innerHTML = '<li>데이터가 없습니다.</li>';
            
            sortedSchools.forEach(([schoolName, totalSeconds], index) => {
                const mins = Math.floor(totalSeconds / 60);
                nList.innerHTML += `<li><span>${index+1}위. ${schoolName}</span> <span>총 ${mins}분</span></li>`;
            });
        }
    </script>
</body>
</html>
